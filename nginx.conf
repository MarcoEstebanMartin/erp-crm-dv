# Configuración típica de Nginx para producción (Host directo)
# Ruta sugerida en Linux: /etc/nginx/sites-available/erp-crm-dv

server {
    listen 80;
    server_name erpcrm.tuservidor.com; # Cambiar por el dominio correspondiente

    # Redirección automática a HTTPS (Recomendado para producción)
    # return 301 https://$host$request_uri;

    root /var/www/erp-crm-dv/frontend/dist;
    index index.html;

    # SPA Fallback routing
    location / {
        try_files $uri $uri/ /index.html;
        
        # Opciones de caché para HTML (No cachear para siempre recibir la última versión)
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Caché agresiva para recursos estáticos (CSS, JS, imágenes) ya que Vite genera nombres únicos con hashes (assets/[name]-[hash].js)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Proxy inverso para el backend de Node.js (corriendo por ejemplo en PM2 en puerto 3000)
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Habilitar compresión Gzip de alto rendimiento
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.code
        text/vtt
        text/x-component
        text/x-cross-domain-policy;
}
