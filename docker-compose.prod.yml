services:
  db:
    image: postgres:16-alpine
    container_name: erp_crm_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?FATAL_Definir_POSTGRES_PASSWORD_en_entorno}
      POSTGRES_DB: ${POSTGRES_DB:-erp_crm_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # SEGURIDAD: Puerto 5432 NO expuesto al exterior; accesible solo en red interna Docker
    expose:
      - "5432"
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-erp_crm_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_crm_backend
    restart: always
    # SEGURIDAD: Escucha solo en loopback del host (detrás de Nginx/Reverse Proxy), no expuesto a internet directo
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TRUST_PROXY=1
      - JSON_BODY_LIMIT=1mb
      - CORS_ORIGIN=${CORS_ORIGIN:?FATAL_Definir_CORS_ORIGIN_explicito_en_produccion}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?FATAL_Definir_POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp_crm_production}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?FATAL_Definir_POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp_crm_production}?schema=public
      - JWT_SECRET=${JWT_SECRET:?FATAL_Definir_JWT_SECRET_criptografico_en_produccion}
      - AFIP_CUIT=${AFIP_CUIT:?FATAL_Definir_AFIP_CUIT}
      - AFIP_PRODUCTION=${AFIP_PRODUCTION:-false}
      - AFIP_CERT_PATH=${AFIP_CERT_PATH:-./certs/homo.crt}
      - AFIP_KEY_PATH=${AFIP_KEY_PATH:-./certs/homo.key}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - IGNORE_STOCK_CHECK=false
    networks:
      - internal_net
      - web_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp_crm_frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - web_net
    depends_on:
      backend:
        condition: service_healthy

networks:
  internal_net:
    internal: true
  web_net:
    driver: bridge

volumes:
  postgres_data:
