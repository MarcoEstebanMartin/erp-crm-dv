version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: erp_crm_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-production_db_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-erp_crm_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_crm_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-production_db_secure_password}@db:5432/${POSTGRES_DB:-erp_crm_production}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-production_db_secure_password}@db:5432/${POSTGRES_DB:-erp_crm_production}?schema=public
      - JWT_SECRET=${JWT_SECRET:-production_super_secret_jwt_key_to_be_replaced}
      - AFIP_CUIT=20123456789
      - AFIP_PRODUCTION=false
      - AFIP_CERT_PATH=./certs/homo.crt
      - AFIP_KEY_PATH=./certs/homo.key
      - GEMINI_API_KEY=your_gemini_api_key
      - IGNORE_STOCK_CHECK=false
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp_crm_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
